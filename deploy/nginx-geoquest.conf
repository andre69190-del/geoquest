# ============================================================================
#  GeoQuest — nginx Site-Konfiguration fuer Self-Hosting
#  Domain : geoquest.arndt-software.de
#  Docroot: /var/www/geoquest
#  Ablage : /etc/nginx/sites-available/geoquest.arndt-software.de.conf
#           danach:  ln -s ../sites-available/... /etc/nginx/sites-enabled/
#
#  Bildet 1:1 das bisherige Vercel-Routing/Verhalten ab (aus vercel.json):
#    /            -> landing.html
#    /play        -> index.html  (die App, no-cache -> PWA-Update)
#    sonst        -> vorhandene Datei, sonst index.html (SPA-Fallback)
#  Cache: sw.js / index.html / manifest.json / landing / play = no-cache,
#         statische Assets (Bilder/Fonts) lange, Rest 1h.
#  Security-Header identisch zu vercel.json.
# ============================================================================

# Cache-Control je nach URL (im http-Kontext, daher hier auf Dateiebene ok).
map $uri $geoquest_cache {
    default                               "public, max-age=3600";
    ~*\.(?:png|jpg|jpeg|gif|ico|woff2?)$  "public, max-age=2592000, immutable";
    ~*\.svg$                              "public, max-age=2592000";
    ~*/sw\.js$                            "no-cache, no-store, must-revalidate";
    ~*/index\.html$                       "no-cache";
    ~*/manifest\.json$                    "no-cache";
    "/"                                   "no-cache";
    "/play"                               "no-cache";
    ~*/landing\.html$                     "no-cache";
}

# ---- HTTP: ACME-Challenge + Redirect auf HTTPS -----------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name geoquest.arndt-software.de;

    # Let's Encrypt (webroot) — muss VOR dem Redirect stehen
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: die eigentliche Seite ------------------------------------------
# Hinweis: existiert das Zertifikat noch nicht, diesen server-Block zunaechst
# auskommentieren, certbot laufen lassen (siehe SELFHOST_SETUP.md), dann wieder
# einkommentieren und `nginx -s reload`.
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name geoquest.arndt-software.de;

    ssl_certificate     /etc/letsencrypt/live/geoquest.arndt-software.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoquest.arndt-software.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/geoquest;

    # Security-Header (global; KEIN add_header in den location-Bloecken,
    # sonst wuerden diese hier nicht vererbt!)
    add_header X-Content-Type-Options   "nosniff"                                              always;
    add_header X-Frame-Options          "DENY"                                                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"                      always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"                 always;
    add_header Cache-Control            $geoquest_cache                                        always;

    # Kompression (index.html ist ~6 MB -> wichtig)
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/manifest+json;

    # Routing (nur try_files / kein add_header hier)
    location = / {
        try_files /landing.html =404;
    }
    location = /play {
        try_files /index.html =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # Alles andere: vorhandene Datei ausliefern, sonst App (SPA-Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
