# ============================================================================
#  GeoQuest — nginx-Config INNERHALB des Docker-Containers (fuer Coolify)
#  Wird nach /etc/nginx/conf.d/geoquest.conf kopiert (ersetzt default.conf).
#  NUR Port 80, KEIN TLS/Redirect — HTTPS macht der Coolify-Proxy (Traefik).
#  Bildet das bisherige Routing/Verhalten ab:
#    /     -> landing.html     /play -> index.html (App)     sonst -> index.html
# ============================================================================

map $uri $geoquest_cache {
    default                               "public, max-age=3600";
    ~*\.(?:png|jpg|jpeg|gif|ico|woff2?)$  "public, max-age=2592000, immutable";
    ~*\.svg$                              "public, max-age=2592000";
    ~*/sw\.js$                            "no-cache, no-store, must-revalidate";
    ~*/index\.html$                       "no-cache";
    ~*/manifest\.json$                    "no-cache";
    "/"                                   "no-cache";
    "/play"                               "no-cache";
    ~*/landing\.html$                     "no-cache";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # Security-Header (KEIN add_header in den location-Bloecken, sonst nicht vererbt!)
    add_header X-Content-Type-Options    "nosniff"                                              always;
    add_header X-Frame-Options           "DENY"                                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                      always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"                  always;
    add_header Cache-Control             $geoquest_cache                                        always;

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/manifest+json;

    location = / {
        try_files /landing.html =404;
    }
    location = /play {
        try_files /index.html =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
